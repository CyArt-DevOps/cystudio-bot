name: Deploy to MonkeyBytes

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PANEL: https://dash.monkey-network.xyz
      SERVER: 879b406c
      KEY: ${{ secrets.PTERO_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Syntax check
        run: for f in *.mjs modules/*.mjs; do node --check "$f"; done

      # Only app code ships; .env and data/ on the server are never touched.
      - name: Build bundle
        run: |
          git archive --format=tar.gz -o deploy.tar.gz HEAD -- \
            index.mjs start.mjs quest-bank.mjs config.json package.json package-lock.json modules
          tar -tzf deploy.tar.gz

      - name: Upload, unpack, restart
        run: |
          set -euo pipefail
          if [ -z "$KEY" ]; then echo "::warning::PTERO_API_KEY secret not set - skipping deploy"; exit 0; fi
          api() { curl -fsS -H "Authorization: Bearer $KEY" -H "Accept: Application/vnd.pterodactyl.v1+json" -H "Content-Type: application/json" "$@"; }
          BASE="$PANEL/api/client/servers/$SERVER"

          URL=$(api "$BASE/files/upload" | jq -r .attributes.url)
          curl -fsS -F "files=@deploy.tar.gz" "$URL&directory=/"

          api -X POST "$BASE/files/decompress" -d '{"root":"/","file":"deploy.tar.gz"}'
          api -X POST "$BASE/files/delete" -d '{"root":"/","files":["deploy.tar.gz"]}'
          api -X POST "$BASE/power" -d '{"signal":"restart"}'
          echo "Deployed $GITHUB_SHA and restarted server $SERVER"
