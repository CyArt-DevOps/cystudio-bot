name: Deploy to MonkeyBytes

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PANEL: https://dash.monkey-network.xyz
      SERVER: d1b3b3fe
      KEY: ${{ secrets.PTERO_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Syntax check
        run: for f in *.mjs modules/*.mjs; do node --check "$f"; done

      # The server git-pulls main and runs npm install on every start (AUTO_UPDATE=1),
      # so deploying is just a restart. .env and data/ on the server are never touched.
      - name: Restart server
        run: |
          set -euo pipefail
          if [ -z "$KEY" ]; then echo "::warning::PTERO_API_KEY secret not set - skipping restart"; exit 0; fi
          curl -fsS -X POST "$PANEL/api/client/servers/$SERVER/power" \
            -H "Authorization: Bearer $KEY" -H "Accept: Application/vnd.pterodactyl.v1+json" \
            -H "Content-Type: application/json" -d '{"signal":"restart"}'
          echo "Restarted $SERVER; it will pull $GITHUB_SHA on boot"
